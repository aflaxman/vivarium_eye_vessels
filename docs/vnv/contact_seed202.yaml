components:
  vivarium_eye_vessels.components:
  - particles.Particle3D()
  - particles.PathFreezer()
  - particles.PathExtinction()
  - particles.PathSplitter()
  - particles.PathAnastomosis()
  - flow.FlowRemodeler()
  - plexus.PlexusLayers()
  - boundaries.EllipsoidContainment()
  - boundaries.CylinderExclusion()
  - boundaries.PointRepulsion()
  - boundaries.FrozenRepulsion()
  - boundaries.PerfusionDemand()
  - boundaries.DevelopmentalWave()
  - visualizer.ParticleVisualizer3D()
  - observers.SaveParticles()
configuration:
  cylinder_exclusion:
    center:
    - -.05
    - 0.0
    - -0.2
    direction:
    - 0.0
    - 0.0
    - 1.0
    force_type: hookean
    height: 0.4
    radius: 0.4
    spring_constant: 3
  developmental_wave:
    advance_rule: combined
    advance_threshold: 0.85
    enabled: true
    gate_caliber_max: 0.0
    hold_resprout_steps: 15
    lookahead: 0.25
    resprout_count: 2
    start_radius: 0.15
    wave_speed: 0.006
  ellipsoid_containment:
    a: 2
    b: 2
    c: 0.1
    force_type: hookean
    spring_constant: 3
  flow_remodeler:
    adaptation_deadband: 2.0
    adaptation_rate: 0.05
    artery_pressure: 1.0
    balanced_arterial_inflow: false
    leak_fraction: 0.01
    max_adapted_radius: 0.006
    max_radius: 0.02
    min_radius: 0.001
    prune_grace_days: 0.0
    remodel_interval: 25
    shear_threshold_fraction: 0.65
    start_time: '2025-01-08'
    tissue_pressure: 0.0
    vein_pressure: -1.0
  frozen_repulsion:
    cross_type_factor: 0.25
    delay: 1
    force_type: hookean
    interaction_radius: 0.12
    spring_constant: 1.5
  particles:
    artery_caliber_ratio: 0.67
    initial_circle:
      center:
      - 1.0
      - 0.0
      - 0.0
      n_vessels: 6
      radius: 0.05
    initial_velocity_range:
    - -0.2
    - 0.2
    noise_caliber_exponent: 1.5
    noise_caliber_reference: 0.004
    noise_persistence_time: 0.0
    overall_max_velocity_change: 0.2
    root_radius: 0.02
    terminal_velocity: 0.15
  path_anastomosis:
    capture_radius: 0.035
    max_target_radius: 0.004
    max_tip_radius: 0.004
    probability: 0.5
  path_dla:
    dla_end_time: '2025-09-01'
    dla_start_time: '2025-02-01'
    final_near_radius: 0.01
    initial_near_radius: 0.04
    stickiness: 1.0
  path_extinction:
    force_threshold: 2.0
  path_freezer:
    freeze_interval: 2
    radius_taper: 0.998
  path_splitter:
    caliber_cadence_exponent: 0.75
    continuation_keeps_path: true
    crowding_radius: 0.06
    flow_asymmetry: 0.15
    max_crowding: 0
    max_depth: 4
    min_active_tips: 1
    min_radius: 0.002
    murray_exponent: 3.0
    resprout_established_size: 200
    side_branch_flow: 0.15
    side_branch_probability: 0.65
    side_branch_radius: 0.006
    split_angle: 60
    split_interval: 15
    split_probability: 0.95
  perfusion_demand:
    influence_radius: 2.0
    magnitude: 0.35
    perfusion_radius: 0.15
    site_spacing: 0.1
    survival_factor: 1.0
  plexus_layers:
    damping: 5.0
    dive_probability: 0.04
    dive_radius: 0.004
    layer_z:
    - 0.04
    - 0.0
    - -0.04
    max_force: 0.3
    spring_constant: 6.0
  point_repulsion:
    force_type: hookean
    position:
      x: 1.0
      y: 0.0
      z: 0.0
    radius: 0.2
    spring_constant: 0.5
  population:
    population_size: 500
  randomness:
    random_seed: 202
  time:
    end:
      day: 1
      month: 9
      year: 2025
    start:
      day: 1
      month: 1
      year: 2025
    step_size: 0.05
  visualization:
    background_color:
    - 0
    - 0
    - 0
    cylinder_color:
    - 0
    - 0
    - 150
    ellipsoid_color:
    - 150
    - 0
    - 150
    ellipsoid_points: 15
    fps: 60
    particle_color:
    - 0
    - 120
    - 120
    particle_size: 2
    projection_scale: 1000.0
    rotation_speed: 0.02
    screen_height: 800
    screen_width: 1200
