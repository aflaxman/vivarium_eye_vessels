components:
    vivarium_eye_vessels.components:
        - particles.Particle3D()
        - particles.PathFreezer()
        - particles.PathExtinction()
        - particles.PathSplitter()
        - particles.PathAnastomosis()
        - flow.FlowRemodeler()
        - plexus.PlexusLayers()
        # - particles.PathDLA()
        - boundaries.EllipsoidContainment()
        - boundaries.CylinderExclusion()
        - boundaries.PointRepulsion()
        - boundaries.FrozenRepulsion()
        - boundaries.PerfusionDemand()
        - boundaries.DevelopmentalWave()
        - visualizer.ParticleVisualizer3D()
        - observers.SaveParticles()

configuration:
    randomness:
        random_seed: 123456
    time:
        start:
            year: 2025
            month: 1
            day: 1
        end:
            year: 2025
            month: 9
            day: 1
        step_size: .05 # Days
    population:
        population_size: 500

    # Base particle configuration
    particles:
        overall_max_velocity_change: 0.2
        initial_velocity_range: [-0.2, 0.2]
        terminal_velocity: 0.15
        initial_circle:
            center: [1.0, 0.0, 0.0]    # Center of the frozen circle
            radius: 0.05                # Radius of the circle
            n_vessels: 6               # Root trunks at the disc (3 artery/vein pairs);
                                       # more superficial arcades close most of the gap
                                       # to the HRF density metrics (vnv_calibrate fit)
        root_radius: 0.02              # Caliber of the root (vein) vessels
        artery_caliber_ratio: 0.67     # Arteries are ~2/3 the caliber of veins (clinical AVR)
        noise_persistence_time: 0.0    # OU steering memory (days); 0 = white noise.
                                       # Healthy tortuosity is already on target; raising
                                       # this is the DR-like disease dial (tortuosity up,
                                       # perfusion down) -- see realism roadmap idea 7
        noise_caliber_reference: 0.004  # Tips at or below capillary caliber steer freely
        noise_caliber_exponent: 1.5     # Wider tips hold their heading: random steering
                                        # is attenuated by (reference/radius)^exponent so
                                        # the arcades sweep smoothly instead of wandering

    # Path freezing configuration
    path_freezer:
        freeze_interval: 2  # Steps between freezing positions
        radius_taper: 0.998  # Gradual caliber taper along each path

    # Path splitting configuration
    path_splitter:
        split_interval: 15     # Steps between checking for splits
        split_angle: 60         # Fallback angle when the parent has no caliber
        split_probability: 0.95  # Split probability at the min_radius caliber floor
        max_depth: 4
        murray_exponent: 3.0   # r_parent^k = r_major^k + r_minor^k at bifurcations
        flow_asymmetry: 0.15   # Minor daughter flow fraction drawn from [0.35, 0.5]
        min_radius: 0.002      # Caliber floor (capillary scale)
        caliber_cadence_exponent: 0.75  # Wider tips split less often (vnv_calibrate fit)
        side_branch_flow: 0.15     # Comb mode: trunks shed side branches carrying
                                   # ~15% of the flow at near-perpendicular angles
                                   # (multi-seed caliber-profile fit: thicker teeth
                                   # fill the 5-7 px band real fundi carry)
        side_branch_radius: 0.006  # Parents wider than this side-branch instead of
                                   # splitting dichotomously; 0.006 extends the comb
                                   # one caliber class down (teeth grow sub-teeth),
                                   # the structure real mid-vessels show. Robustness
                                   # note: one of three calibration seeds stalls
                                   # mid-growth under this -- see the roadmap
        side_branch_probability: 0.65  # Tooth emission per split round: sets the
                                       # comb spacing along the arcades
                                       # (vnv_calibrate: sim 26px vs HRF 22.7px;
                                       # 0.8 packs tighter but collapses seed 7)
        # Growth-reliability mechanisms (roadmap ninth pass), both OFF: every
        # configuration that improved the calibration seeds hurt held-out
        # seeds -- the growth front is near-critical, and these knobs
        # reshuffle which seeds fill rather than making every seed viable
        # (docs/vnv/contact_sheet.png tracks held-out reliability)
        crowding_radius: 0.06   # Neighborhood for the crowding gate
        max_crowding: 0         # Skip splits at tips with this many frozen
                                # neighbors (comb teeth exempt); 0 = no gate
        min_active_tips: 1      # Re-sprout when a tree's front thins below this;
                                # 1 = legacy re-sprout only at total extinction
        resprout_established_size: 200  # The tip floor only applies once a tree
                                        # has this many frozen particles (a real
                                        # front to lose); early on, few tips is
                                        # the natural state
        continuation_keeps_path: true   # At a split the continuing daughter keeps
                                        # its parent's path_id, so its own fresh
                                        # trail stays exempt from repulsion. Legacy
                                        # relabeling killed root arcades at their
                                        # first split and was the seed lottery:
                                        # with it fixed, every calibration and
                                        # held-out seed reaches full perfusion
                                        # (roadmap thirteenth pass)

    path_extinction:
        force_threshold: 2.0  # Headroom over the stacked steering forces (perfusion
                              # pull, plexus layering, planar crowding repulsion) so
                              # tips survive long enough to colonize their layer

    # Flow-based remodeling: Poiseuille flow on the frozen graph, then prune
    # low-shear terminal segments and drift calibers toward the median shear
    # (see docs/poiseuille_flow.md)
    flow_remodeler:
        remodel_interval: 25
        start_time: '2025-01-08'   # Let the arcades establish before pruning begins
        artery_pressure: 1.0
        vein_pressure: -1.0
        tissue_pressure: 0.0
        leak_fraction: 0.01        # Per-node tissue leak vs. median segment conductance
        shear_threshold_fraction: 0.65  # Prune terminal segments below this x median shear
        prune_grace_days: 0.0      # Spare terminals younger than this from pruning. OFF:
                                   # pruning also declutters -- spared dead-end stubs
                                   # stay as repulsion sources that choke the tips, so
                                   # 5-10 days rescues seed 7 (168 -> 80) but halves
                                   # the fit seed's network (51 -> 122); 2.5 days is
                                   # worse on every seed (roadmap eleventh pass)
        adaptation_rate: 0.05      # Caliber drift toward the median-shear radius
                                   # (vnv_calibrate composition fit: lower rate keeps
                                   # adaptation from hollowing out the mid calibers)
        min_radius: 0.001
        max_radius: 0.02
        max_adapted_radius: 0.003  # Shear-driven thickening saturates at the caliber
                                   # of a precapillary arteriole/venule (1.5 px at the
                                   # V&V raster scale); guards the anastomosis-shortcut
                                   # runaway that promoted curly capillary paths to fat
                                   # vessels. The adaptation median is set by the
                                   # deep-plexus capillaries, so nearly every
                                   # superficial segment reads as high-shear and is
                                   # ground up to this cap: at 0.006 half the
                                   # superficial length sat at 3 px where a real eye's
                                   # finest fundus-visible vessels are 1-2 px
                                   # (roadmap sixteenth pass; 3-seed mean 165 -> 27)
        adaptation_deadband: 2.0   # Segments within 2x of their tree's median shear
                                   # keep their born caliber instead of being ground
                                   # toward the cap (multi-seed caliber-profile fit)
        balanced_arterial_inflow: false  # Split total arterial inflow equally across
                                         # the artery roots (current sources) so no
                                         # arcade can starve its siblings. Physically
                                         # right (unit-tested) but off by default:
                                         # multi-seed evaluation shows it feeds flow
                                         # into stalled fragments on collapse-prone
                                         # seeds, worsening their score

    # Stratified plexuses: superficial arcades, capillary-only deeper layers
    # connected by diving vessels
    plexus_layers:
        layer_z: [0.04, 0.0, -0.04]  # Superficial, intermediate, deep z-planes
        spring_constant: 6.0         # z-pull toward a vessel's own plexus plane
        damping: 5.0                 # Damps vertical oscillation around the plane
        max_force: 0.3               # Cap the pull below the extinction threshold
        dive_radius: 0.003           # Only capillary-caliber tips dive deeper. Tips of
                                     # 0.003-0.004 (1.5-2 px) are precapillary
                                     # arterioles and venules, which real fundi show in
                                     # the superficial plexus; keeping them there lifts
                                     # superficial skeleton density 2.7% -> 3.1% (HRF
                                     # 3.7%) without hurting perfusion (multi-seed fit
                                     # with the adaptation cap, mean 27 -> 22)
        dive_probability: 0.04       # Per-step chance an eligible tip dives
                                     # (multi-seed vnv_calibrate fit: best mean
                                     # score across seeds 123456/7/42)

    # Anastomosis: capillary tips fuse onto the other tree, closing the loops
    path_anastomosis:
        capture_radius: 0.035     # Tip-to-target distance that triggers fusion
                                  # (vnv_calibrate composition fit)
        max_tip_radius: 0.004     # Only capillary-caliber tips anastomose
        max_target_radius: 0.004  # And only onto capillary-caliber segments
        probability: 0.5          # Per-step fusion probability once in range

    # Hypoxia-driven growth: space-colonization attraction toward unperfused tissue
    perfusion_demand:
        site_spacing: 0.1        # Lattice spacing of tissue demand sites
        perfusion_radius: 0.15   # Tissue within this distance of a vessel is perfused
        influence_radius: 2.0    # Hypoxic sites recruit growth tips within this distance
        magnitude: 0.35          # Attraction strength, below the extinction threshold
                                 # (vnv_calibrate fit)
        survival_factor: 1.0     # Hypoxia as a survival signal: tips within
                                 # perfusion_radius of unserved tissue tolerate this
                                 # multiple of the extinction force threshold. OFF:
                                 # every factor 1.5-3 rescues seed 7 (168 -> 67) but
                                 # collapses seed 909 (125 -> 884, perfusion 0.47);
                                 # see the roadmap's twelfth pass

    # Closed-loop growth front (roadmap tenth pass): demand is exposed as an
    # expanding wave from the disc that advances only while the tissue behind
    # it is served, and a held front re-sprouts the stalled tree next to the
    # unserved sites. First mechanism to improve every calibration seed at
    # once (3-seed mean 581 -> 115) and it eliminates the catastrophic
    # collapse mode on held-out seeds (min perfusion 0.40 -> 0.87)
    developmental_wave:
        enabled: true
        start_radius: 0.15
        wave_speed: 0.006        # Advance per step while the tissue behind is served
        lookahead: 0.25          # Demand visible this far beyond the front
        advance_threshold: 0.85  # Served fraction inside the front required to
                                 # advance (0.75 outruns weak seeds, 0.95 makes
                                 # strong seeds wait: swept, 0.85 is the balance)
        advance_rule: combined   # Any-vessel service; per_type brakes healthy
                                 # seeds on the artery tree's ~0.85 mid-field
                                 # service ceiling
        hold_resprout_steps: 15  # Held steps before targeted re-sprouting
        resprout_count: 2        # Sprouts per stalled tree per trigger
        gate_caliber_max: 0.0    # 0 gates every tip (the wide-tip exemption
                                 # tested worse: it breaks the front discipline)

    frozen_repulsion:
        force_type: hookean
        spring_constant: 1.5  # Spring constant for Hooke's law (force/distance)
        interaction_radius: 0.12  # Real arcades carry a branch every ~23 px, so
                                  # vessels must be allowed to pack that closely;
                                  # at 0.15 the comb teeth crowd each other into
                                  # extinction (vnv_calibrate composition fit)
        delay: 1 # days
        cross_type_factor: 0.25  # Weak artery-vein repulsion -> interdigitating arcades

    path_dla:
        dla_start_time: '2025-02-01'
        dla_end_time: '2025-09-01'
        stickiness: 1.0                   # Probability of sticking when near frozen particle
        initial_near_radius: 0.04         # Distance for checking proximity to frozen particles
        final_near_radius: 0.01           # Distance for checking proximity to frozen particles

    ellipsoid_containment:
        a: 2    # Ellipsoid x semi-major axis
        b: 2    # Ellipsoid y semi-major axis
        c: 0.1  # Ellipsoid z semi-major axis
        force_type: hookean
        spring_constant: 3
    
    cylinder_exclusion:
        radius: 0.4  # Radius of the cylinder
        height: 0.4  # Height of the cylinder
        center: [-.05, 0.0, -0.2]  # Center of the cylinder
        direction: [0.0, 0.0, 1.0]  # Direction vector of the cylinder (default along z-axis)
        force_type: hookean
        spring_constant: 3  # Spring constant for Hooke's law (force/distance)
        
    point_repulsion:
        position:
            x: 1.0
            y: 0.0
            z: 0.0
        force_type: hookean
        spring_constant: .5  # Spring constant for Hooke's law (force/distance)
        radius: 0.2  # Interaction radius

    visualization:
        background_color: [0, 0, 0]
        particle_size: 2
        rotation_speed: 0.02
        particle_color: [0, 120, 120]
        projection_scale: 1000.0
        fps: 60
        ellipsoid_color: [150, 0, 150]
        cylinder_color: [0, 0, 150]
        ellipsoid_points: 15  # Number of points for wireframe detail
        screen_height: 800
        screen_width: 1200
